[project]
name = "writestory-be"
version = "0.1.0"
description = "WriteStoryApp – backend FastAPI: API, dữ liệu, jobs"
requires-python = ">=3.14"
dependencies = [
    "writestory-ai",
    "fastapi>=0.135",
    "uvicorn>=0.37",
    "pydantic>=2.11",
    "sqlalchemy[asyncio]>=2.0.40",
    "aiosqlite>=0.21",
    "alembic>=1.16",
    "cryptography>=44",
]

[project.scripts]
writestory-backend = "writestory_be.__main__:main"

[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/writestory_be"]
include = ["src/writestory_be/**/*.json"]

[dependency-groups]
build = [
    "pyinstaller>=6.22.3",
]
