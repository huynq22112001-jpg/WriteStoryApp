[project]
name = "writestory-ai"
version = "0.1.0"
description = "WriteStoryApp – package AI: contracts, ports, providers, workflows, gói ngôn ngữ"
requires-python = ">=3.14"
dependencies = [
    "pydantic>=2.11",
    "httpx>=0.28",
    "jinja2>=3.1.6",
]

[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/writestory_ai"]
include = ["src/writestory_ai/**/*.json", "src/writestory_ai/**/*.txt", "src/writestory_ai/**/*.j2", "src/writestory_ai/**/*.md"]
